services:
  telenova-wa-archive:
    build: ./whatsapp-archive
    container_name: telenova-wa-archive
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:3000"
    environment:
      PORT: "3000"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:3001}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN é obrigatório}"
      SESSION_DIR: "/data/sessions"
      EXPORT_DIR: "/data/exports"
      TMP_DIR: "/data/tmp"
      APP_VERSION: "${APP_VERSION:-1.1.3}"
      BUILD_TIME: "${BUILD_TIME:-}"
      GIT_SHA: "${GIT_SHA:-}"
      EXPORTER_VERSION: "1.1.3"
      PUPPETEER_PROTOCOL_TIMEOUT_MS: "${PUPPETEER_PROTOCOL_TIMEOUT_MS:-900000}"
      GET_CHATS_TIMEOUT_MS: "${GET_CHATS_TIMEOUT_MS:-900000}"
      MAX_MESSAGES_PER_CHAT: "${MAX_MESSAGES_PER_CHAT:-20000}"
      MAX_CONCURRENT_EXPORTS: "${MAX_CONCURRENT_EXPORTS:-1}"
      SAFE_MODE: "${SAFE_MODE:-true}"
      CHAT_DELAY_MS: "${CHAT_DELAY_MS:-2500}"
      MEDIA_DELAY_MS: "${MEDIA_DELAY_MS:-800}"
      MAX_CHATS_PER_RUN: "${MAX_CHATS_PER_RUN:-0}"
      MAX_MEDIA_PER_RUN: "${MAX_MEDIA_PER_RUN:-0}"
      DEEP_HISTORY_MODE: "${DEEP_HISTORY_MODE:-false}"
      INITIAL_SYNC_WAIT_MS: "${INITIAL_SYNC_WAIT_MS:-30000}"
      CHAT_SYNC_TIMEOUT_MS: "${CHAT_SYNC_TIMEOUT_MS:-20000}"
      FETCH_RETRY_COUNT: "${FETCH_RETRY_COUNT:-2}"
      FETCH_RETRY_DELAY_MS: "${FETCH_RETRY_DELAY_MS:-3000}"
    volumes:
      - wa_sessions:/data/sessions
      - wa_exports:/data/exports
      - wa_tmp:/data/tmp
    # Chromium headless precisa de mais shared memory.
    # NÃO usamos cap_add SYS_ADMIN — o Chromium roda com --no-sandbox
    # dentro do container, que já está isolado. Mantemos o container
    # com o menor privilégio possível.
    shm_size: "1gb"

volumes:
  wa_sessions:
  wa_exports:
  wa_tmp:
